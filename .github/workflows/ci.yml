name: CI

on:
  push:
  pull_request:

env:
  # Repository text, prompts and fixtures are UTF-8.  Make that contract
  # explicit on Windows instead of inheriting the runner's legacy code page.
  PYTHONUTF8: "1"

jobs:
  public-content:
    name: Public source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_public_release.py

  lint:
    # The checked-in debt baseline was generated against the macOS PySide
    # wheel. PySide's platform wheels expose different typing surfaces, so
    # keep this historical comparison on one locked platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install uv
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check novel_forge tests
      - run: uv run python scripts/check_mypy_baseline.py
      - run: uv run python scripts/lint_prompt_layers.py
      - run: uv run python scripts/audit_prompt_format_layers.py --all
      - run: uv run python scripts/audit_prompt_packs.py
      - run: uv run python scripts/generate_prompt_index.py --check
      - run: uv run python scripts/verify_templates.py
      - run: uv run python scripts/verify_format_contracts.py
      - run: uv run python scripts/verify_control_plane_constraints.py --check
      - run: uv run python scripts/verify_design_tokens.py --check
      - run: uv run python scripts/check_agents_md_drift.py
      - run: uv run python scripts/check_architecture_ratchets.py --check
      - run: uv run python scripts/check_call_site_sync.py --baseline-sync-velocity --baseline-sync-threshold 3
      - run: uv run lint-imports

  backend-contracts:
    name: Backend API and job contracts
    needs: lint
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e ".[dev,desktop]"
      - run: pytest tests/unit/test_api_engine_routes.py tests/unit/test_app_service_jobs.py -q --timeout=300 -p no:xdist

  platform-smoke:
    name: Cross-platform storage and fallback smoke (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e ".[dev,desktop]"
      - name: Run portable storage and fallback checks
        run: pytest tests/desktop/test_window_imports.py tests/desktop/test_windows_event_loop_policy.py tests/desktop/test_strings.py tests/desktop/test_sleep_inhibitor_atexit.py tests/unit/test_humanize_library_store.py -q --timeout=300 -p no:xdist

  nimo-ui:
    name: NIMO Primary UI (React/Tauri frontend)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:check
      - run: pnpm ui:test
      - run: pnpm ui:build
      - run: pnpm --filter @nimo/desktop check:interaction

  desktop-tests:
    name: PySide6 Fallback Compatibility (full, Ubuntu)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1 libpulse0
      - name: Install
        run: pip install -e ".[dev,desktop]"
      - name: Run desktop tests (non-visual baseline)
        env:
          QT_QPA_PLATFORM: offscreen
          NOVEL_FORGE_MEMORY_USE_MOCK_EMBEDDINGS: "true"
        run: pytest tests/desktop --ignore-glob='tests/desktop/*_visual.py' --ignore-glob='tests/desktop/test_visual_regression.py' -p no:xdist --timeout=300 -q

  visual-tests:
    name: PySide6 Fallback Visual Reference
    needs: lint
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e ".[dev,desktop]"
      - run: sudo apt-get install -y libegl1 libgles2 libgl1
      - run: pytest tests/desktop/*_visual.py -q --timeout=180 -p no:xdist

  contract-consumers:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # check_contract_consumers defaults to HEAD~1, so retain the parent commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/check_contract_consumers.py

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install uv pip-audit
      - name: Export the locked third-party dependency set
        run: uv export --quiet --frozen --all-extras --no-emit-project --no-hashes --output-file audit-requirements.txt
      - run: pip-audit --strict --desc --requirement audit-requirements.txt
      - name: Generate the locked dependency SBOM
        run: uv export --quiet --frozen --all-extras --no-emit-project --format cyclonedx1.5 --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-json
          path: sbom.json
