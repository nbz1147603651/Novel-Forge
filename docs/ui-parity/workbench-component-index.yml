version: 1
scope: phase-1-react-tauri-ui
rules:
  - Pages consume EngineClient view models only.
  - Components never read Python source, environment variables, API keys, or model profiles directly.
  - Every dialog uses OverlaySurface; no page-owned keyboard or focus implementation.
  - Every incremental task view consumes TaskStreamEvent with monotonic sequence numbers.
  - Every artifact reader consumes RenderDocumentView and remains read-only until a future engine command is introduced.
  - Dense settings workbenches load only after an explicit user action; page navigation never starts connectivity work or constructs a routing matrix.

