version: 2
scope: phase-1-react-tauri-ui
source_of_truth:
  desktop_root: novel_forge/desktop
  registration: novel_forge/desktop/page_registrations.py
  baseline_directory: tests/desktop/baselines
  default_theme: narrative_ember
  themes: [narrative_ember, ink_jade, ink_amethyst, stillwater, twilight_ink]
  viewports:
    default: [1440, 900]
    minimum: [1180, 760]
    wide: [1728, 1117]
  fixture_policy: fixed-engine-client-views
  dynamic_masks: [elapsed-time, token-count, timestamp, random-id, animation-frame]

status_legend:
  inventory: source-and-trigger-confirmed
  foundation: React interaction exists, but source parity is not yet accepted
  partial: only a subset of required source states is implemented
  pending: no React equivalent yet
  accepted: same-fixture visual comparison has met the threshold

