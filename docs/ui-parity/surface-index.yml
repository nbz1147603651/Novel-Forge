acceptance:
  default-theme-static-max-diff-ratio: 0.0075
  component-max-diff-ratio: 0.0025
  required-before-accepted:
    - source-capture
    - same-fixture-and-viewport
    - dynamic-mask-review
    - core-interaction-check
    - target-platform-tauri-capture
